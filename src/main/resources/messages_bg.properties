section.info.title=Информация
section.info.body1=Добре дошли в Iskarman!
section.info.body2=Присъединете се към приятелско предизвикателство за плуване в открити води като състезател или доброволец (каяк, подкрепа) на 12-ти (или 13-ти) септември 2026 г.
section.info.facebook=Свържете се с нас във Facebook:
section.trackRules.title=Трасе и правила
section.track.title=Трасе
section.track.intro=Има 2 опции: 5км и 10км.
section.track.5km=5км: до контролна точка 1 (Боришки залив) и обратно.
section.track.10km=10км: затворен кръг
section.rules.title=Правила
section.rules.1=Всеки плувец или група плувци трябва да бъдат придружавани от каяк, SUP или лодка и да носят буй за плуване.
section.rules.2=Хранене: планирайте и осигурете каквото е нужно! Придружаващия каяк/лодка трябва да носят всичко необходимо за плуването.
section.rules.3=Плавници и педълси СА разрешени, но плувците без помощни средства са класирани първи!
section.rules.4=Неопрените са разрешени.
section.rules.5=В случай на спешност или за прекратяване на плуването разчитайте на вашия каяк/лодка или повикайте моторна лодка.
section.baseCamp.title=Базов лагер
