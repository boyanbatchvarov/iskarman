section.info.title=Info
section.info.body1=Welcome to Iskarman!
section.info.body2=Join us in a friendly openwater challenge as a swimmer or volunteer (kayaker, support) on the 12th (or 13th) of September 2026.
section.info.facebook=Contact us on Facebook:
section.trackRules.title=Track & Rules
section.track.title=Track
section.track.intro=There are 2 options: 5km and 10km.
section.track.5km=5km: to checkpoint 1 (Borishki zaliv) and back.
section.track.10km=10km: closed loop
section.rules.title=Rules
section.rules.1=Every swimmer or group of swimmers should be supported by a kayak or boat, and must carry a swimming buoy.
section.rules.2=Feeding is self-supported: your kayaker should carry all you need for the swim.
section.rules.3=Fins and hand paddles ARE allowed, but non-assisted swimmers are ranked first!
section.rules.4=Wetsuits are allowed.
section.rules.5=In case of emergency or to abort the swim, rely on your support kayaker/boat or call for a motorboat.
section.baseCamp.title=Base camp
section.baseCamp.body=BulSailing academy. (A few) kayaks and sailboats can be rented on the spot.
